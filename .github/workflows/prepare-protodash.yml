name: Prepare validated ProtoDash contribution
on:
  push:
    branches: [codex/prepare-protodash]
    paths: [.github/workflows/prepare-protodash.yml]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          ref: 0ce916f33b7e149c12dfdb85ae7dcad831fbc1f2
      - name: Publish the verified tree as one signed-off commit
        env:
          PATCH_BASE64: ""
        run: |
          set -eu
          test "$GITHUB_REPOSITORY" = Hanabi9248/AIX360
          test -z "$(git ls-remote --heads origin refs/heads/codex/protodash-candidate-selection)"
          printf '%s' "$PATCH_BASE64" | base64 --decode > /tmp/protodash.patch
          git apply --index /tmp/protodash.patch
          test "$(git write-tree)" = 5284faca2300894961f394848a7579c45dfa5936
          git -c user.name='Hanabi' -c user.email=317387557+Hanabi9248@users.noreply.github.com commit --signoff -m 'Preserve the best candidate during ProtoDash selection'
          test "$(git rev-parse HEAD^)" = 0ce916f33b7e149c12dfdb85ae7dcad831fbc1f2
          git push origin HEAD:refs/heads/codex/protodash-candidate-selection
