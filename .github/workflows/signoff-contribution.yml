name: Sign off AIX360 contribution
on:
  push:
    branches: [codex/signoff-single-class]
permissions:
  contents: write
jobs:
  signoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve the verified tree and add the missing sign-off
        env:
          GIT_AUTHOR_NAME: Hanabi
          GIT_AUTHOR_EMAIL: 317387557+Hanabi9248@users.noreply.github.com
          GIT_COMMITTER_NAME: Hanabi
          GIT_COMMITTER_EMAIL: 317387557+Hanabi9248@users.noreply.github.com
        run: |
          set -eu
          branch=codex/single-class-ruleset-metrics
          expected=62e2ac18a286a564daa8412112741c8fae94fd79
          base=0ce916f33b7e149c12dfdb85ae7dcad831fbc1f2
          tree=7db86d7ddb6b7cec3183c1d32ad9d1b127055c76
          git fetch origin "$branch"
          test "$(git rev-parse FETCH_HEAD)" = "$expected"
          test "$(git rev-parse FETCH_HEAD^{tree})" = "$tree"
          signed=$(git commit-tree "$tree" -p "$base" -m 'Fix ruleset metrics for single-class batches' -m 'Signed-off-by: Hanabi <317387557+Hanabi9248@users.noreply.github.com>')
          git diff --exit-code "$expected" "$signed"
          git push --force-with-lease="refs/heads/$branch:$expected" origin "$signed:refs/heads/$branch"
